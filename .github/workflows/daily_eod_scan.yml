name: Daily 5:30 PM EOD Stock Scanner

on:
  schedule:
    # 17:30 IST is 12:00 UTC (IST = UTC + 5:30)
    # Runs Monday through Friday after Indian market close
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-eod-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Free Scanner Pipeline
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN || secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET || secrets.ANGEL_TOTP_KEY }}
        run: |
          python scripts/generate_free_data.py

      - name: Commit and Push Updated Scanner Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/free_scanner_data.json free_scanner_widget.html
          git diff --staged --quiet || (git commit -m "Auto-update EOD scanner data [skip ci]" && git push origin main)
